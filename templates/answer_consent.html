<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="google" content="notranslate" />
  <meta http-equiv="Content-Language" content="en" />
  <title>Questionnaire Consent</title>
  <style>
    :root {
      --bg: #f6f9fc;
      --panel: #ffffff;
      --text: #1a2330;
      --muted: #56657a;
      --accent: #0a6c7e;
      --border: #d7e1ea;
      --ok: #1f7a45;
      --err: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
      padding: 20px;
    }
    .container {
      max-width: 920px;
      margin: 0 auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      overflow: hidden;
    }
    .header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 1.2rem; }
    .meta { color: var(--muted); font-size: 0.92rem; margin-top: 3px; }
    nav { display: flex; gap: 10px; }
    nav a { color: var(--accent); text-decoration: none; font-size: 0.92rem; }
    .content { padding: 14px; }
    .card {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fcfdff;
      padding: 12px;
      margin-bottom: 10px;
    }
    h2 { margin: 0 0 8px; font-size: 1rem; }
    .instructions {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      line-height: 1.5;
    }
    .instructions :first-child {
      margin-top: 0;
    }
    .instructions :last-child {
      margin-bottom: 0;
    }
    .instructions p,
    .instructions ul,
    .instructions ol,
    .instructions blockquote,
    .instructions pre {
      margin: 0 0 8px;
    }
    .instructions code {
      background: #eff4f8;
      border-radius: 4px;
      padding: 1px 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9em;
    }
    .instructions pre {
      background: #eff4f8;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      overflow-x: auto;
    }
    .instructions pre code {
      background: transparent;
      padding: 0;
    }
    .consent-row {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin-top: 8px;
    }
    button, a.button-link {
      border: 0;
      border-radius: 8px;
      padding: 9px 12px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font: inherit;
      text-decoration: none;
      display: inline-block;
    }
    a.button-link.secondary {
      background: #fff;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .status { margin-top: 8px; min-height: 18px; font-size: 0.9rem; }
    .ok { color: var(--ok); }
    .err { color: var(--err); }
  </style>
</head>
<body>
  <main class="container">
    <section class="header">
      <div>
        <h1>Questionnaire Consent</h1>
        <div id="headline" class="meta">Loading questionnaire...</div>
      </div>
      <nav>
        {% if show_questionnaires_link %}<a href="/questionnaires">Questionnaires</a>{% endif %}
        {% if show_users_link %}<a href="/users">Users</a>{% endif %}
        {% if show_assigned_link %}<a href="/assigned">Assigned</a>{% endif %}
        {% if show_settings_link %}<a href="/settings">Settings</a>{% endif %}
      </nav>
    </section>

    <section class="content">
      <article class="card">
        <h2>Instructions</h2>
        <div id="instructions" class="instructions"></div>
      </article>

      <article class="card">
        <h2>Consent</h2>
        <div id="consent-text"></div>
        <label class="consent-row">
          <input id="consent-check" type="checkbox" />
          <span>I consent to proceed with this questionnaire.</span>
        </label>
        <div id="consent-note" class="meta"></div>
      </article>

      <div class="row">
        <button id="continue-btn" type="button">Consent and start</button>
        <a class="button-link secondary" href="/assigned">Back to assigned</a>
      </div>
      <div id="status" class="status"></div>
    </section>
  </main>

  <script>
    const QUESTIONNAIRE_VERSION_ID = {{ questionnaire_version_id | tojson }};
    const DEFAULT_CONSENT_TEXT = "I confirm I understand this evaluation, I agree to submit my responses for this questionnaire version, and I understand my responses are stored for analysis.";
    const state = { alreadyConsented: false };

    function setStatus(message, ok) {
      const el = document.getElementById("status");
      el.className = ok ? "status ok" : "status err";
      el.textContent = message || "";
    }

    async function requestJson(url, options = {}) {
      const response = await fetch(url, { credentials: "include", ...options });
      let data = {};
      try {
        data = await response.json();
      } catch (_error) {
        data = {};
      }
      if (!response.ok) {
        throw new Error(data.detail || `Request failed (${response.status})`);
      }
      return data;
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function isSafeUrl(value) {
      const url = String(value || "").trim();
      if (!url) return false;
      if (url.startsWith("/") || url.startsWith("#")) return true;
      if (/^https?:\/\//i.test(url)) return true;
      if (/^mailto:/i.test(url)) return true;
      if (/^data:image\//i.test(url)) return true;
      return false;
    }

    function sanitizeHtml(html) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(`<div>${String(html || "")}</div>`, "text/html");
      const root = doc.body.firstElementChild;
      if (!root) return "";

      const allowedTags = new Set([
        "a",
        "b",
        "blockquote",
        "br",
        "code",
        "em",
        "h1",
        "h2",
        "h3",
        "h4",
        "h5",
        "h6",
        "hr",
        "i",
        "img",
        "li",
        "ol",
        "p",
        "pre",
        "strong",
        "ul",
      ]);
      const blockedTags = new Set(["script", "style", "iframe", "object", "embed", "svg", "math"]);

      function sanitizeNode(node) {
        for (const child of Array.from(node.childNodes)) {
          if (child.nodeType === Node.COMMENT_NODE) {
            child.remove();
            continue;
          }
          if (child.nodeType !== Node.ELEMENT_NODE) {
            continue;
          }

          const el = child;
          const tag = el.tagName.toLowerCase();

          if (blockedTags.has(tag)) {
            el.remove();
            continue;
          }

          if (!allowedTags.has(tag)) {
            const fragment = doc.createDocumentFragment();
            while (el.firstChild) {
              fragment.appendChild(el.firstChild);
            }
            el.replaceWith(fragment);
            sanitizeNode(node);
            continue;
          }

          for (const attr of Array.from(el.attributes)) {
            const name = attr.name.toLowerCase();
            if (name.startsWith("on") || name === "style") {
              el.removeAttribute(attr.name);
              continue;
            }
            if (tag === "a" && (name === "href" || name === "target" || name === "rel")) {
              continue;
            }
            if (tag === "img" && (name === "src" || name === "alt" || name === "title")) {
              continue;
            }
            el.removeAttribute(attr.name);
          }

          if (tag === "a") {
            const href = el.getAttribute("href");
            if (!isSafeUrl(href)) {
              el.removeAttribute("href");
            }
            el.setAttribute("target", "_blank");
            el.setAttribute("rel", "noopener noreferrer");
          }

          if (tag === "img") {
            const src = el.getAttribute("src");
            if (!isSafeUrl(src)) {
              el.remove();
              continue;
            }
          }

          sanitizeNode(el);
        }
      }

      sanitizeNode(root);
      return root.innerHTML;
    }

    function renderInlineMarkdown(text) {
      let html = String(text || "");
      html = html.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>');
      html = html.replace(/`([^`]+)`/g, (_match, code) => `<code>${escapeHtml(code)}</code>`);
      html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      return html;
    }

    function renderMarkdownToHtml(markdown) {
      const raw = String(markdown || "").replaceAll("\r\n", "\n");
      if (!raw.trim()) {
        return "<p>No instructions.</p>";
      }

      const lines = raw.split("\n");
      const html = [];
      let paragraph = [];
      let inUl = false;
      let inOl = false;
      let inCode = false;
      let codeLines = [];

      function flushParagraph() {
        if (!paragraph.length) return;
        html.push(`<p>${renderInlineMarkdown(paragraph.join(" "))}</p>`);
        paragraph = [];
      }

      function closeLists() {
        if (inUl) {
          html.push("</ul>");
          inUl = false;
        }
        if (inOl) {
          html.push("</ol>");
          inOl = false;
        }
      }

      for (const originalLine of lines) {
        const line = originalLine.trim();

        if (line.startsWith("```")) {
          flushParagraph();
          closeLists();
          if (inCode) {
            html.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
            inCode = false;
            codeLines = [];
          } else {
            inCode = true;
            codeLines = [];
          }
          continue;
        }

        if (inCode) {
          codeLines.push(originalLine);
          continue;
        }

        if (!line) {
          flushParagraph();
          closeLists();
          continue;
        }

        if (line.startsWith("<") && line.endsWith(">")) {
          flushParagraph();
          closeLists();
          html.push(line);
          continue;
        }

        const heading = line.match(/^(#{1,6})\s+(.+)$/);
        if (heading) {
          flushParagraph();
          closeLists();
          const level = heading[1].length;
          html.push(`<h${level}>${renderInlineMarkdown(heading[2])}</h${level}>`);
          continue;
        }

        const unordered = line.match(/^[-*]\s+(.+)$/);
        if (unordered) {
          flushParagraph();
          if (inOl) {
            html.push("</ol>");
            inOl = false;
          }
          if (!inUl) {
            html.push("<ul>");
            inUl = true;
          }
          html.push(`<li>${renderInlineMarkdown(unordered[1])}</li>`);
          continue;
        }

        const ordered = line.match(/^\d+\.\s+(.+)$/);
        if (ordered) {
          flushParagraph();
          if (inUl) {
            html.push("</ul>");
            inUl = false;
          }
          if (!inOl) {
            html.push("<ol>");
            inOl = true;
          }
          html.push(`<li>${renderInlineMarkdown(ordered[1])}</li>`);
          continue;
        }

        const quote = line.match(/^>\s?(.+)$/);
        if (quote) {
          flushParagraph();
          closeLists();
          html.push(`<blockquote>${renderInlineMarkdown(quote[1])}</blockquote>`);
          continue;
        }

        if (inUl || inOl) {
          closeLists();
        }
        paragraph.push(line);
      }

      if (inCode) {
        html.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
      }
      flushParagraph();
      closeLists();
      return sanitizeHtml(html.join(""));
    }

    async function init() {
      const detail = await requestJson(`/api/user/questionnaires/${QUESTIONNAIRE_VERSION_ID}`);
      document.getElementById("headline").textContent = `${detail.title} v${detail.version_number}`;
      document.getElementById("instructions").innerHTML = renderMarkdownToHtml(detail.instructions_markdown);
      document.getElementById("consent-text").innerHTML = renderMarkdownToHtml(
        detail.consent_text || DEFAULT_CONSENT_TEXT
      );

      const consent = await requestJson(`/api/user/questionnaires/${QUESTIONNAIRE_VERSION_ID}/consent`);
      state.alreadyConsented = consent.consented === true;
      if (state.alreadyConsented) {
        const check = document.getElementById("consent-check");
        check.checked = true;
        document.getElementById("consent-note").textContent = `Already consented at ${consent.consented_at}.`;
        document.getElementById("continue-btn").textContent = "Continue to questions";
      }
    }

    document.getElementById("continue-btn").addEventListener("click", async () => {
      try {
        const checked = document.getElementById("consent-check").checked;
        if (!checked && !state.alreadyConsented) {
          throw new Error("You must check consent to continue.");
        }

        if (!state.alreadyConsented) {
          await requestJson(`/api/user/questionnaires/${QUESTIONNAIRE_VERSION_ID}/consent`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ consented: true }),
          });
        }

        window.location.assign(`/answer/${QUESTIONNAIRE_VERSION_ID}?q=1`);
      } catch (error) {
        setStatus(error.message || String(error), false);
      }
    });

    init().catch((error) => {
      setStatus(error.message || String(error), false);
    });
  </script>
</body>
</html>
