<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="google" content="notranslate" />
  <meta http-equiv="Content-Language" content="en" />
  <title>medirater</title>
  <style>
    :root {
      --bg: #f6f9fc;
      --panel: #ffffff;
      --text: #1a2330;
      --muted: #56657a;
      --accent: #0a6c7e;
      --border: #d7e1ea;
      --ok: #1f7a45;
      --err: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
      padding: 20px;
    }
    .container {
      max-width: 1080px;
      margin: 0 auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      overflow: hidden;
    }
    .header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 1.2rem; }
    .meta { color: var(--muted); font-size: 0.92rem; margin-top: 3px; }
    nav { display: flex; gap: 10px; }
    nav a { color: var(--accent); text-decoration: none; font-size: 0.92rem; }
    .content { padding: 14px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 8px 12px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font: inherit;
    }
    .status { margin-top: 8px; min-height: 18px; font-size: 0.9rem; }
    .ok { color: var(--ok); }
    .err { color: var(--err); }
    .muted { color: var(--muted); }
    .subtext { color: var(--muted); font-size: 0.84rem; margin-top: 4px; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.9rem;
    }
    th, td {
      border-bottom: 1px solid var(--border);
      text-align: left;
      padding: 7px 6px;
      vertical-align: top;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div style="max-width:1080px;margin:0 auto 10px;"><a href="/" style="font-size:1.15rem;color:var(--accent);text-decoration:none;text-transform:uppercase;letter-spacing:0.05em;font-weight:700;">medirater</a></div>
  <main class="container">
    <section class="header">
      <div>
        <h1>Assigned Questionnaires</h1>
      </div>
      <nav>
        {% if show_questionnaires_link %}<a href="/questionnaires">Questionnaires</a>{% endif %}
        {% if show_users_link %}<a href="/users">Users</a>{% endif %}
        {% if show_assigned_link %}<a href="/assigned">Assigned</a>{% endif %}
        {% if show_account_link %}<a id="account-link" href="/account">Account</a>{% endif %}
      </nav>
    </section>

    <section class="content">
      <div class="row">
        <button id="refresh-btn">Refresh</button>
      </div>
      <div id="status" class="status"></div>

      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Version</th>
            <th>Questions</th>
            <th>Assigned</th>
            <th>Submitted</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </section>
  </main>

  <script>
    function setStatus(message, ok) {
      const el = document.getElementById("status");
      el.className = ok ? "status ok" : "status err";
      el.textContent = message || "";
    }

    function setAccountNavLabel(username) {
      const accountLink = document.getElementById("account-link");
      if (accountLink && username) {
        accountLink.textContent = `Account (${username})`;
      }
    }

    async function requestJson(url, options = {}) {
      const response = await fetch(url, { credentials: "include", ...options });
      let data = {};
      try {
        data = await response.json();
      } catch (_error) {
        data = {};
      }
      if (!response.ok) {
        throw new Error(data.detail || `Request failed (${response.status})`);
      }
      return data;
    }

    function isSafeUrl(value) {
      const url = String(value || "").trim();
      if (!url) return false;
      if (url.startsWith("/") || url.startsWith("#")) return true;
      if (/^https?:\/\//i.test(url)) return true;
      if (/^mailto:/i.test(url)) return true;
      if (/^data:image\//i.test(url)) return true;
      return false;
    }

    function sanitizeHtml(html) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(`<div>${String(html || "")}</div>`, "text/html");
      const root = doc.body.firstElementChild;
      if (!root) return "";

      const allowedTags = new Set([
        "a", "b", "blockquote", "br", "code", "em",
        "h1", "h2", "h3", "h4", "h5", "h6", "hr",
        "i", "img", "li", "ol", "p", "pre", "strong", "ul",
      ]);
      const blockedTags = new Set(["script", "style", "iframe", "object", "embed", "svg", "math"]);

      function sanitizeNode(node) {
        for (const child of Array.from(node.childNodes)) {
          if (child.nodeType === Node.COMMENT_NODE) { child.remove(); continue; }
          if (child.nodeType !== Node.ELEMENT_NODE) continue;
          const el = child;
          const tag = el.tagName.toLowerCase();
          if (blockedTags.has(tag)) { el.remove(); continue; }
          if (!allowedTags.has(tag)) {
            const fragment = doc.createDocumentFragment();
            while (el.firstChild) fragment.appendChild(el.firstChild);
            el.replaceWith(fragment);
            sanitizeNode(node);
            continue;
          }
          for (const attr of Array.from(el.attributes)) {
            const name = attr.name.toLowerCase();
            if (name.startsWith("on") || name === "style") { el.removeAttribute(attr.name); continue; }
            if (tag === "a" && (name === "href" || name === "target" || name === "rel")) continue;
            if (tag === "img" && (name === "src" || name === "alt" || name === "title")) continue;
            el.removeAttribute(attr.name);
          }
          if (tag === "a") {
            if (!isSafeUrl(el.getAttribute("href"))) el.removeAttribute("href");
            el.setAttribute("target", "_blank");
            el.setAttribute("rel", "noopener noreferrer");
          }
          if (tag === "img") {
            if (!isSafeUrl(el.getAttribute("src"))) { el.remove(); continue; }
          }
          sanitizeNode(el);
        }
      }

      sanitizeNode(root);
      return root.innerHTML;
    }

    function renderRows(items) {
      const tbody = document.getElementById("tbody");
      tbody.innerHTML = "";
      if (!items.length) {
        const tr = document.createElement("tr");
        tr.innerHTML = '<td colspan="6" class="muted">No assigned questionnaires.</td>';
        tbody.appendChild(tr);
        return;
      }

      for (const item of items) {
        const tr = document.createElement("tr");
        const description = item.description ? `<div class="subtext">${sanitizeHtml(item.description)}</div>` : "";
        tr.innerHTML = `
          <td>${sanitizeHtml(item.title)}${description}</td>
          <td>v${item.version_number}</td>
          <td>${item.question_count}</td>
          <td>${item.assigned_at}</td>
          <td>${item.submitted_at || "-"}</td>
          <td><a href="/answer/${item.questionnaire_version_id}/consent">Open</a></td>
        `;
        tbody.appendChild(tr);
      }
    }

    async function loadAssigned() {
      try {
        const items = await requestJson("/api/user/assigned-questionnaires");
        renderRows(items || []);
        setStatus("", true);
      } catch (error) {
        renderRows([]);
        setStatus(error.message || String(error), false);
      }
    }

    async function init() {
      try {
        const me = await requestJson("/api/auth/me");
        setAccountNavLabel(me.username);
      } catch (_error) {
      }

      await loadAssigned();
    }

    document.getElementById("refresh-btn").addEventListener("click", loadAssigned);
    init();
  </script>
</body>
</html>
