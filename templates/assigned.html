<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="google" content="notranslate" />
  <meta http-equiv="Content-Language" content="en" />
  <title>Assigned Questionnaires</title>
  <style>
    :root {
      --bg: #f6f9fc;
      --panel: #ffffff;
      --text: #1a2330;
      --muted: #56657a;
      --accent: #0a6c7e;
      --border: #d7e1ea;
      --ok: #1f7a45;
      --err: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
      padding: 20px;
    }
    .container {
      max-width: 1080px;
      margin: 0 auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      overflow: hidden;
    }
    .header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 1.2rem; }
    .meta { color: var(--muted); font-size: 0.92rem; margin-top: 3px; }
    nav { display: flex; gap: 10px; }
    nav a { color: var(--accent); text-decoration: none; font-size: 0.92rem; }
    .content { padding: 14px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 8px 12px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font: inherit;
    }
    .status { margin-top: 8px; min-height: 18px; font-size: 0.9rem; }
    .ok { color: var(--ok); }
    .err { color: var(--err); }
    .muted { color: var(--muted); }
    .subtext { color: var(--muted); font-size: 0.84rem; margin-top: 4px; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.9rem;
    }
    th, td {
      border-bottom: 1px solid var(--border);
      text-align: left;
      padding: 7px 6px;
      vertical-align: top;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="header">
      <div>
        <h1>Assigned Questionnaires</h1>
        <div id="whoami" class="meta">Loading user...</div>
      </div>
      <nav>
        {% if show_questionnaires_link %}<a href="/questionnaires">Questionnaires</a>{% endif %}
        {% if show_users_link %}<a href="/users">Users</a>{% endif %}
        {% if show_assigned_link %}<a href="/assigned">Assigned</a>{% endif %}
        {% if show_settings_link %}<a href="/settings">Settings</a>{% endif %}
      </nav>
    </section>

    <section class="content">
      <div class="row">
        <button id="refresh-btn">Refresh</button>
      </div>
      <div id="status" class="status"></div>

      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Version</th>
            <th>Questions</th>
            <th>Assigned</th>
            <th>Submitted</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </section>
  </main>

  <script>
    function setStatus(message, ok) {
      const el = document.getElementById("status");
      el.className = ok ? "status ok" : "status err";
      el.textContent = message || "";
    }

    async function requestJson(url, options = {}) {
      const response = await fetch(url, { credentials: "include", ...options });
      let data = {};
      try {
        data = await response.json();
      } catch (_error) {
        data = {};
      }
      if (!response.ok) {
        throw new Error(data.detail || `Request failed (${response.status})`);
      }
      return data;
    }

    function renderRows(items) {
      const tbody = document.getElementById("tbody");
      tbody.innerHTML = "";
      if (!items.length) {
        const tr = document.createElement("tr");
        tr.innerHTML = '<td colspan="6" class="muted">No assigned questionnaires.</td>';
        tbody.appendChild(tr);
        return;
      }

      for (const item of items) {
        const tr = document.createElement("tr");
        const description = item.description ? `<div class="subtext">${item.description}</div>` : "";
        tr.innerHTML = `
          <td>${item.title}${description}</td>
          <td>v${item.version_number}</td>
          <td>${item.question_count}</td>
          <td>${item.assigned_at}</td>
          <td>${item.submitted_at || "-"}</td>
          <td><a href="/answer/${item.questionnaire_version_id}/consent">Open</a></td>
        `;
        tbody.appendChild(tr);
      }
    }

    async function loadAssigned() {
      try {
        const items = await requestJson("/api/user/assigned-questionnaires");
        renderRows(items || []);
        setStatus(`Loaded ${items.length} assigned questionnaires.`, true);
      } catch (error) {
        renderRows([]);
        setStatus(error.message || String(error), false);
      }
    }

    async function init() {
      try {
        const me = await requestJson("/api/auth/me");
        document.getElementById("whoami").textContent = `Signed in as ${me.username} (${me.role})`;
      } catch (error) {
        document.getElementById("whoami").textContent = error.message || String(error);
      }

      await loadAssigned();
    }

    document.getElementById("refresh-btn").addEventListener("click", loadAssigned);
    init();
  </script>
</body>
</html>
