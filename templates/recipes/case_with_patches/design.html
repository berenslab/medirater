<p class="small">
  In this recipe, patches are the questions. Use the required per-patch template in the workspace below.
  Case-level question templates are disabled.
</p>

<label for="recipe-case-img-folder">Main image folder</label>
<input
  id="recipe-case-img-folder"
  placeholder="img"
  data-recipe-config-key="img_folder"
  data-config-type="string"
  data-required="true"
  data-default-value="img"
/>

<label for="recipe-case-patch-folder">Patch folder</label>
<input
  id="recipe-case-patch-folder"
  placeholder="patch"
  data-recipe-config-key="patch_folder"
  data-config-type="string"
  data-required="true"
  data-default-value="patch"
/>

<label for="recipe-case-patch-strict">Strict mode</label>
<select id="recipe-case-patch-strict" data-recipe-config-key="strict" data-config-type="boolean">
  <option value="true">true</option>
  <option value="false">false</option>
</select>
