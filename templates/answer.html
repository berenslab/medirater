<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="google" content="notranslate" />
  <meta http-equiv="Content-Language" content="en" />
  <title>medirator</title>
  <style>
    :root {
      --bg: #f6f9fc;
      --panel: #ffffff;
      --text: #1a2330;
      --muted: #56657a;
      --accent: #0a6c7e;
      --border: #d7e1ea;
      --ok: #1f7a45;
      --err: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
      padding: 20px;
    }
    .container {
      max-width: 980px;
      margin: 0 auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      overflow: hidden;
    }
    .header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 1.2rem; }
    .meta { color: var(--muted); font-size: 0.92rem; margin-top: 3px; }
    nav { display: flex; gap: 10px; }
    nav a { color: var(--accent); text-decoration: none; font-size: 0.92rem; }
    .content { padding: 14px; }
    .card {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fcfdff;
      padding: 12px;
      margin-bottom: 10px;
    }
    h2 { margin: 0 0 8px; font-size: 1rem; }
    p { margin: 0 0 8px; }
    .muted { color: var(--muted); }
    .instructions-inline {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.45;
    }
    .instructions-inline-label {
      margin-top: 10px;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .instructions-inline :first-child {
      margin-top: 0;
    }
    .instructions-inline :last-child {
      margin-bottom: 0;
    }
    .instructions-inline p,
    .instructions-inline ul,
    .instructions-inline ol,
    .instructions-inline li,
    .instructions-inline blockquote,
    .instructions-inline pre {
      margin: 0 0 6px;
    }
    .instructions-inline h1,
    .instructions-inline h2,
    .instructions-inline h3,
    .instructions-inline h4,
    .instructions-inline h5,
    .instructions-inline h6 {
      margin: 0 0 6px;
      font-size: 1em;
      font-weight: 600;
    }
    .instructions-inline code {
      background: #eff4f8;
      border-radius: 4px;
      padding: 1px 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9em;
    }
    .instructions-inline pre {
      background: #eff4f8;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      overflow-x: auto;
    }
    .instructions-inline pre code {
      background: transparent;
      padding: 0;
    }
    .required { color: #b42318; }
    .media-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 8px;
      margin: 8px 0;
    }
    .media-strip img {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #f8fbff;
    }
    label.choice {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 4px 0;
    }
    textarea, input[type="text"] {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
      background: #fff;
    }
    textarea { min-height: 100px; resize: vertical; }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    button, a.button-link {
      border: 0;
      border-radius: 8px;
      padding: 9px 12px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font: inherit;
      text-decoration: none;
      display: inline-block;
    }
    button.secondary, a.button-link.secondary {
      background: #fff;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .status { margin-top: 8px; min-height: 18px; font-size: 0.9rem; }
    .ok { color: var(--ok); }
    .err { color: var(--err); }
  </style>
</head>
<body>
  <div style="max-width:980px;margin:0 auto 10px;"><a href="/" style="font-size:0.95rem;color:var(--accent);text-decoration:none;text-transform:uppercase;letter-spacing:0.04em;font-weight:600;">medirator</a></div>
  <main class="container">
    <section class="header">
      <div>
        <h1>Answer Questionnaire</h1>
        <div id="headline" class="meta">Loading questionnaire...</div>
      </div>
      <nav>
        {% if show_questionnaires_link %}<a href="/questionnaires">Questionnaires</a>{% endif %}
        {% if show_users_link %}<a href="/users">Users</a>{% endif %}
        {% if show_assigned_link %}<a href="/assigned">Assigned</a>{% endif %}
        {% if show_settings_link %}<a href="/settings">Settings</a>{% endif %}
      </nav>
    </section>

    <section class="content">
      <div style="margin-bottom: 10px;">
        <a class="button-link secondary" href="/assigned">Back to assigned</a>
      </div>

      <article class="card">
        <h2 id="progress-title">Loading...</h2>
        <div id="question-root"></div>
      </article>

      <div class="row">
        <button id="prev-btn" class="secondary" type="button">Previous</button>
        <button id="next-btn" type="button">Next case</button>
      </div>
      <div class="instructions-inline-label">Instructions</div>
      <div id="instructions" class="instructions-inline"></div>
      <div id="status" class="status"></div>
    </section>
  </main>

  <script>
    const QUESTIONNAIRE_VERSION_ID = {{ questionnaire_version_id | tojson }};
    const DRAFT_STORAGE_KEY = `medirator.answer.draft.${QUESTIONNAIRE_VERSION_ID}`;

    const state = {
      detail: null,
      answersByQuestionId: new Map(),
      caseGroups: [],
      currentCaseIndex: 0,
      stimulusHideTimerId: null,
    };

    function setStatus(message, ok) {
      const el = document.getElementById("status");
      el.className = ok ? "status ok" : "status err";
      el.textContent = message || "";
    }

    async function requestJson(url, options = {}) {
      const response = await fetch(url, { credentials: "include", ...options });
      let data = {};
      try {
        data = await response.json();
      } catch (_error) {
        data = {};
      }
      if (!response.ok) {
        throw new Error(data.detail || `Request failed (${response.status})`);
      }
      return data;
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function isSafeUrl(value) {
      const url = String(value || "").trim();
      if (!url) return false;
      if (url.startsWith("/") || url.startsWith("#")) return true;
      if (/^https?:\/\//i.test(url)) return true;
      if (/^mailto:/i.test(url)) return true;
      if (/^data:image\//i.test(url)) return true;
      return false;
    }

    function sanitizeHtml(html) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(`<div>${String(html || "")}</div>`, "text/html");
      const root = doc.body.firstElementChild;
      if (!root) return "";

      const allowedTags = new Set([
        "a",
        "b",
        "blockquote",
        "br",
        "code",
        "em",
        "h1",
        "h2",
        "h3",
        "h4",
        "h5",
        "h6",
        "hr",
        "i",
        "img",
        "li",
        "ol",
        "p",
        "pre",
        "strong",
        "ul",
      ]);
      const blockedTags = new Set(["script", "style", "iframe", "object", "embed", "svg", "math"]);

      function sanitizeNode(node) {
        for (const child of Array.from(node.childNodes)) {
          if (child.nodeType === Node.COMMENT_NODE) {
            child.remove();
            continue;
          }
          if (child.nodeType !== Node.ELEMENT_NODE) {
            continue;
          }

          const el = child;
          const tag = el.tagName.toLowerCase();

          if (blockedTags.has(tag)) {
            el.remove();
            continue;
          }

          if (!allowedTags.has(tag)) {
            const fragment = doc.createDocumentFragment();
            while (el.firstChild) {
              fragment.appendChild(el.firstChild);
            }
            el.replaceWith(fragment);
            sanitizeNode(node);
            continue;
          }

          for (const attr of Array.from(el.attributes)) {
            const name = attr.name.toLowerCase();
            if (name.startsWith("on") || name === "style") {
              el.removeAttribute(attr.name);
              continue;
            }
            if (tag === "a" && (name === "href" || name === "target" || name === "rel")) {
              continue;
            }
            if (tag === "img" && (name === "src" || name === "alt" || name === "title")) {
              continue;
            }
            el.removeAttribute(attr.name);
          }

          if (tag === "a") {
            const href = el.getAttribute("href");
            if (!isSafeUrl(href)) {
              el.removeAttribute("href");
            }
            el.setAttribute("target", "_blank");
            el.setAttribute("rel", "noopener noreferrer");
          }

          if (tag === "img") {
            const src = el.getAttribute("src");
            if (!isSafeUrl(src)) {
              el.remove();
              continue;
            }
          }

          sanitizeNode(el);
        }
      }

      sanitizeNode(root);
      return root.innerHTML;
    }

    function renderInlineMarkdown(text) {
      let html = String(text || "");
      html = html.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>');
      html = html.replace(/`([^`]+)`/g, (_match, code) => `<code>${escapeHtml(code)}</code>`);
      html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      return html;
    }

    function renderMarkdownToHtml(markdown) {
      const raw = String(markdown || "").replaceAll("\r\n", "\n");
      if (!raw.trim()) {
        return "<p>No instructions.</p>";
      }

      const lines = raw.split("\n");
      const html = [];
      let paragraph = [];
      let inUl = false;
      let inOl = false;
      let inCode = false;
      let codeLines = [];

      function flushParagraph() {
        if (!paragraph.length) return;
        html.push(`<p>${renderInlineMarkdown(paragraph.join(" "))}</p>`);
        paragraph = [];
      }

      function closeLists() {
        if (inUl) {
          html.push("</ul>");
          inUl = false;
        }
        if (inOl) {
          html.push("</ol>");
          inOl = false;
        }
      }

      for (const originalLine of lines) {
        const line = originalLine.trim();

        if (line.startsWith("```")) {
          flushParagraph();
          closeLists();
          if (inCode) {
            html.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
            inCode = false;
            codeLines = [];
          } else {
            inCode = true;
            codeLines = [];
          }
          continue;
        }

        if (inCode) {
          codeLines.push(originalLine);
          continue;
        }

        if (!line) {
          flushParagraph();
          closeLists();
          continue;
        }

        if (line.startsWith("<") && line.endsWith(">")) {
          flushParagraph();
          closeLists();
          html.push(line);
          continue;
        }

        const heading = line.match(/^(#{1,6})\s+(.+)$/);
        if (heading) {
          flushParagraph();
          closeLists();
          const level = heading[1].length;
          html.push(`<h${level}>${renderInlineMarkdown(heading[2])}</h${level}>`);
          continue;
        }

        const unordered = line.match(/^[-*]\s+(.+)$/);
        if (unordered) {
          flushParagraph();
          if (inOl) {
            html.push("</ol>");
            inOl = false;
          }
          if (!inUl) {
            html.push("<ul>");
            inUl = true;
          }
          html.push(`<li>${renderInlineMarkdown(unordered[1])}</li>`);
          continue;
        }

        const ordered = line.match(/^\d+\.\s+(.+)$/);
        if (ordered) {
          flushParagraph();
          if (inUl) {
            html.push("</ul>");
            inUl = false;
          }
          if (!inOl) {
            html.push("<ol>");
            inOl = true;
          }
          html.push(`<li>${renderInlineMarkdown(ordered[1])}</li>`);
          continue;
        }

        const quote = line.match(/^>\s?(.+)$/);
        if (quote) {
          flushParagraph();
          closeLists();
          html.push(`<blockquote>${renderInlineMarkdown(quote[1])}</blockquote>`);
          continue;
        }

        if (inUl || inOl) {
          closeLists();
        }
        paragraph.push(line);
      }

      if (inCode) {
        html.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
      }
      flushParagraph();
      closeLists();
      return sanitizeHtml(html.join(""));
    }

    function clampCaseIndex(index, total) {
      if (total <= 0) return 0;
      if (index < 0) return 0;
      if (index >= total) return total - 1;
      return index;
    }

    function getCaseIndexFromUrl(total) {
      const params = new URLSearchParams(window.location.search);
      if (!params.has("q")) {
        return null;
      }
      const raw = params.get("q");
      const qParam = Number.parseInt(raw || "", 10);
      if (!Number.isFinite(qParam)) {
        return null;
      }
      const candidate = qParam - 1;
      return clampCaseIndex(candidate, total);
    }

    function isAnsweredValue(question, value) {
      if (value === undefined || value === null) {
        return false;
      }
      if (question.question_type === "multi_choice") {
        return Array.isArray(value) && value.length > 0;
      }
      if (question.question_type === "short_text" || question.question_type === "long_text") {
        return typeof value === "string" && value.trim().length > 0;
      }
      if (question.question_type === "single_choice") {
        return typeof value === "string" && value.trim().length > 0;
      }
      return true;
    }

    function findFirstUnansweredCaseIndex(caseGroups, answersByQuestionId) {
      for (let caseIndex = 0; caseIndex < caseGroups.length; caseIndex += 1) {
        const caseGroup = caseGroups[caseIndex];
        for (const question of caseGroup.questions) {
          const value = answersByQuestionId.get(question.id);
          if (!isAnsweredValue(question, value)) {
            return caseIndex;
          }
        }
      }
      return 0;
    }

    function moveToCaseIndex(nextIndex) {
      const url = new URL(window.location.href);
      url.searchParams.set("q", String(nextIndex + 1));
      window.location.assign(url.toString());
    }

    function getReferencedAssetIds(question) {
      const config = question.config || {};
      const ids = [];
      if (Array.isArray(config.stimulus_asset_ids)) {
        for (const id of config.stimulus_asset_ids) {
          if (typeof id === "string" && id) ids.push(id);
        }
      }
      if (typeof config.patch_asset_id === "string" && config.patch_asset_id) {
        ids.push(config.patch_asset_id);
      }
      return ids;
    }

    function clearStimulusHideTimer() {
      if (state.stimulusHideTimerId !== null) {
        window.clearTimeout(state.stimulusHideTimerId);
        state.stimulusHideTimerId = null;
      }
    }

    function getCaseStimulusHideSeconds(caseGroup) {
      let minSeconds = null;
      for (const question of caseGroup.questions || []) {
        const rawValue = question?.config?.stimulus_hide_after_seconds;
        const parsed = Number.parseInt(String(rawValue ?? ""), 10);
        if (!Number.isFinite(parsed) || parsed <= 0) {
          continue;
        }
        if (minSeconds === null || parsed < minSeconds) {
          minSeconds = parsed;
        }
      }
      return minSeconds;
    }

    function loadDraftFromStorage() {
      try {
        const raw = localStorage.getItem(DRAFT_STORAGE_KEY);
        if (!raw) return new Map();
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) return new Map();
        return new Map(Object.entries(parsed));
      } catch (_error) {
        return new Map();
      }
    }

    function persistDraftToStorage() {
      const payload = Object.fromEntries(state.answersByQuestionId.entries());
      localStorage.setItem(DRAFT_STORAGE_KEY, JSON.stringify(payload));
    }

    function readCurrentAnswerValue(question) {
      if (question.question_type === "single_choice") {
        const checked = document.querySelector(`input[name='q-${question.id}']:checked`);
        if (!checked) return undefined;
        return checked.value;
      }

      if (question.question_type === "multi_choice") {
        const checks = Array.from(document.querySelectorAll(`input[name='q-${question.id}']:checked`));
        const values = checks.map((input) => input.value);
        if (!values.length) return undefined;
        return values;
      }

      if (question.question_type === "short_text") {
        const input = document.querySelector(`input[data-question-id='${question.id}']`);
        const value = (input?.value || "").trim();
        return value || undefined;
      }

      const textarea = document.querySelector(`textarea[data-question-id='${question.id}']`);
      const value = (textarea?.value || "").trim();
      return value || undefined;
    }

    function getCaseKey(question) {
      const raw = String(question?.config?.case_key || "").trim();
      if (raw) {
        return raw;
      }
      return `question-${question.id}`;
    }

    function groupQuestionsIntoCases(questions) {
      const byKey = new Map();
      const ordered = [...(questions || [])].sort((a, b) => a.position - b.position);
      for (const question of ordered) {
        const caseKey = getCaseKey(question);
        if (!byKey.has(caseKey)) {
          byKey.set(caseKey, {
            case_key: caseKey,
            first_position: question.position,
            questions: [],
            asset_ids: [],
          });
        }
        const group = byKey.get(caseKey);
        group.questions.push(question);

        const assetIds = getReferencedAssetIds(question);
        for (const assetId of assetIds) {
          if (!group.asset_ids.includes(assetId)) {
            group.asset_ids.push(assetId);
          }
        }
      }
      return Array.from(byKey.values()).sort((a, b) => a.first_position - b.first_position);
    }

    function saveCurrentCaseAnswers({ enforceRequired }) {
      const currentCase = state.caseGroups[state.currentCaseIndex];
      if (!currentCase) {
        return;
      }

      for (let index = 0; index < currentCase.questions.length; index += 1) {
        const question = currentCase.questions[index];
        const value = readCurrentAnswerValue(question);
        if (value === undefined) {
          state.answersByQuestionId.delete(question.id);
          if (enforceRequired && question.is_required) {
            throw new Error(`Question ${index + 1} on this page is required.`);
          }
          continue;
        }
        state.answersByQuestionId.set(question.id, value);
      }
      persistDraftToStorage();
    }

    function validateAllRequiredAnswers() {
      for (let caseIndex = 0; caseIndex < state.caseGroups.length; caseIndex += 1) {
        const caseGroup = state.caseGroups[caseIndex];
        for (let questionIndex = 0; questionIndex < caseGroup.questions.length; questionIndex += 1) {
          const question = caseGroup.questions[questionIndex];
          if (!question.is_required) continue;

          const value = state.answersByQuestionId.get(question.id);
          const errorMessage = caseIndex === state.currentCaseIndex
            ? `Question ${questionIndex + 1} on this page is required.`
            : `Case ${caseIndex + 1}, question ${questionIndex + 1} is required.`;

          if (value === undefined) {
            throw new Error(errorMessage);
          }
          if (question.question_type === "multi_choice" && Array.isArray(value) && value.length === 0) {
            throw new Error(errorMessage);
          }
          if ((question.question_type === "short_text" || question.question_type === "long_text") && typeof value === "string" && !value.trim()) {
            throw new Error(errorMessage);
          }
        }
      }
    }

    function buildSubmitAnswers() {
      const answers = [];
      for (const question of state.detail.questions || []) {
        if (!state.answersByQuestionId.has(question.id)) continue;
        answers.push({ question_id: question.id, value: state.answersByQuestionId.get(question.id) });
      }
      return answers;
    }

    function renderQuestionInCase(root, question) {
      const wrapper = document.createElement("section");
      wrapper.className = "card";
      wrapper.style.margin = "8px 0 0";
      wrapper.innerHTML = `<h2>${question.prompt_text}${question.is_required ? ' <span class="required">*</span>' : ''}</h2>`;

      const existing = state.answersByQuestionId.get(question.id);

      if (question.question_type === "single_choice") {
        for (const choice of question.choices || []) {
          const label = document.createElement("label");
          label.className = "choice";
          const input = document.createElement("input");
          input.type = "radio";
          input.name = `q-${question.id}`;
          input.value = choice.value;
          if (existing === choice.value) input.checked = true;
          const span = document.createElement("span");
          span.textContent = choice.label;
          label.appendChild(input);
          label.appendChild(span);
          wrapper.appendChild(label);
        }
      } else if (question.question_type === "multi_choice") {
        const existingSet = Array.isArray(existing) ? new Set(existing) : new Set();
        for (const choice of question.choices || []) {
          const label = document.createElement("label");
          label.className = "choice";
          const input = document.createElement("input");
          input.type = "checkbox";
          input.name = `q-${question.id}`;
          input.value = choice.value;
          if (existingSet.has(choice.value)) input.checked = true;
          const span = document.createElement("span");
          span.textContent = choice.label;
          label.appendChild(input);
          label.appendChild(span);
          wrapper.appendChild(label);
        }
      } else if (question.question_type === "short_text") {
        const input = document.createElement("input");
        input.type = "text";
        input.dataset.questionId = question.id;
        input.value = typeof existing === "string" ? existing : "";
        wrapper.appendChild(input);
      } else {
        const textarea = document.createElement("textarea");
        textarea.dataset.questionId = question.id;
        textarea.value = typeof existing === "string" ? existing : "";
        wrapper.appendChild(textarea);
      }

      root.appendChild(wrapper);
    }

    function renderCurrentCase() {
      const cases = state.caseGroups || [];
      const total = cases.length;
      const currentCase = cases[state.currentCaseIndex];
      clearStimulusHideTimer();

      document.getElementById("headline").textContent = `${state.detail.title} v${state.detail.version_number}`;
      document.getElementById("instructions").innerHTML = renderMarkdownToHtml(
        state.detail.instructions_markdown
      );

      if (!currentCase) {
        document.getElementById("progress-title").textContent = "No questions";
        document.getElementById("question-root").innerHTML = "<p class='muted'>Nothing to answer.</p>";
        document.getElementById("prev-btn").disabled = true;
        document.getElementById("next-btn").disabled = true;
        return;
      }

      document.getElementById("progress-title").textContent = `Case ${state.currentCaseIndex + 1} of ${total}`;

      const root = document.getElementById("question-root");
      root.innerHTML = "";

      if (currentCase.asset_ids.length) {
        const strip = document.createElement("div");
        strip.className = "media-strip";
        for (const assetId of currentCase.asset_ids) {
          const img = document.createElement("img");
          img.alt = `Case asset ${assetId}`;
          img.src = `/api/user/questionnaires/${QUESTIONNAIRE_VERSION_ID}/assets/${assetId}/content`;
          strip.appendChild(img);
        }
        root.appendChild(strip);

        const hideAfterSeconds = getCaseStimulusHideSeconds(currentCase);
        if (hideAfterSeconds !== null) {
          const hideNote = document.createElement("div");
          hideNote.className = "muted";
          hideNote.style.margin = "6px 0 0";
          hideNote.textContent = `Images will be hidden after ${hideAfterSeconds} seconds.`;
          root.appendChild(hideNote);

          state.stimulusHideTimerId = window.setTimeout(() => {
            for (const img of strip.querySelectorAll("img")) {
              img.style.visibility = "hidden";
            }
            hideNote.textContent = "Images are hidden.";
            state.stimulusHideTimerId = null;
          }, hideAfterSeconds * 1000);
        }
      }

      for (const question of currentCase.questions) {
        renderQuestionInCase(root, question);
      }

      document.getElementById("prev-btn").disabled = state.currentCaseIndex === 0;
      document.getElementById("next-btn").textContent = state.currentCaseIndex === total - 1
        ? "Submit questionnaire"
        : "Next case";
    }

    async function loadQuestionnaire() {
      const detail = await requestJson(`/api/user/questionnaires/${QUESTIONNAIRE_VERSION_ID}`);
      state.detail = detail;
      state.caseGroups = groupQuestionsIntoCases(detail.questions || []);

      const existingAnswers = new Map((detail.existing_answers || []).map((item) => [item.question_id, item.value]));
      const draftAnswers = loadDraftFromStorage();
      state.answersByQuestionId = new Map(existingAnswers.entries());
      for (const [questionId, value] of draftAnswers.entries()) {
        state.answersByQuestionId.set(questionId, value);
      }

      const caseIndexFromUrl = getCaseIndexFromUrl(state.caseGroups.length);
      if (caseIndexFromUrl !== null) {
        state.currentCaseIndex = caseIndexFromUrl;
      } else {
        state.currentCaseIndex = findFirstUnansweredCaseIndex(
          state.caseGroups,
          state.answersByQuestionId,
        );
      }
      renderCurrentCase();
    }

    async function submitQuestionnaire() {
      saveCurrentCaseAnswers({ enforceRequired: true });
      validateAllRequiredAnswers();

      const answers = buildSubmitAnswers();
      const submitted = await requestJson(`/api/user/questionnaires/${QUESTIONNAIRE_VERSION_ID}/responses`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ answers }),
      });

      localStorage.removeItem(DRAFT_STORAGE_KEY);
      setStatus(`Submitted at ${submitted.submitted_at}. Redirecting...`, true);
      setTimeout(() => {
        window.location.assign("/assigned");
      }, 500);
    }

    document.getElementById("prev-btn").addEventListener("click", () => {
      try {
        saveCurrentCaseAnswers({ enforceRequired: false });
        if (state.currentCaseIndex > 0) {
          moveToCaseIndex(state.currentCaseIndex - 1);
        }
      } catch (error) {
        setStatus(error.message || String(error), false);
      }
    });

    document.getElementById("next-btn").addEventListener("click", async () => {
      try {
        const total = (state.caseGroups || []).length;
        if (!total) {
          setStatus("No questions available.", false);
          return;
        }

        if (state.currentCaseIndex === total - 1) {
          await submitQuestionnaire();
          return;
        }

        saveCurrentCaseAnswers({ enforceRequired: true });
        moveToCaseIndex(state.currentCaseIndex + 1);
      } catch (error) {
        setStatus(error.message || String(error), false);
      }
    });

    loadQuestionnaire().catch((error) => {
      setStatus(error.message || String(error), false);
    });
  </script>
</body>
</html>
